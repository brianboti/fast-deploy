# Optional local hooks; CI runs the same checks.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        files: ^\.github/(workflows/.*\.ya?ml|dependabot\.yml)$  # pre-commit passes matching files explicitly
