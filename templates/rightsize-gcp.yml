name: Rightsize GCP staging
on:
  workflow_dispatch:
    inputs:
      window_days:
        description: Days of Cloud Monitoring data to analyze (1-90)
        required: false
        default: '14'
        type: string
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
concurrency:
  group: gcp-staging-rightsize
  cancel-in-progress: false
jobs:
  rightsize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
      issues: write
      actions: read  # the month's runs and jobs, for this repository's billable Actions minutes in the report
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      REGISTRY_NAME: ${{ vars.ARTIFACT_REPOSITORY }}
      PROBE_SERVICE_ACCOUNT: ${{ vars.PROBE_SERVICE_ACCOUNT }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      RECOVERY_BUCKET: ${{ vars.RECOVERY_BUCKET }}
      WINDOW_DAYS: ${{ inputs.window_days || '14' }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WINDOW_DAYS" =~ ^[0-9]{1,2}$ ]]
      # Read-only analysis of the deployed service. Never checks out or executes application code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PLATFORM_REPOSITORY
          ref: PLATFORM_COMMIT
          persist-credentials: false
          path: platform
          token: ${{ secrets.PLATFORM_READ_TOKEN || github.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r platform/requirements.lock
      - name: Validate configured destination
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
        run: python -m labdeploy.target
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Measure usage and compute right-sizing proposals
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
          GH_TOKEN: ${{ github.token }}
          BILLING_EXPORT_TABLE: ${{ vars.BILLING_EXPORT_TABLE }}
        run: python -m labdeploy.cost
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cost-report
          path: cost-report.json
          if-no-files-found: warn
          retention-days: 90
      # One living issue per repository carries the latest report, so the lab sees it without asking Claude.
      - name: Publish the report as an issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/platform
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > issue-body.md
          import json, os
          from labdeploy.cost import issue_body
          print(issue_body(json.load(open("cost-report.json")), os.environ["RUN_URL"]))
          PY
          # The job never checks out this repository, so every gh call names it explicitly.
          TITLE="Lab Deploy cost report: $SERVICE"
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md > /dev/null && echo "updated issue #$NUMBER"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file issue-body.md > /dev/null && echo "created the cost report issue"
          fi
  notify:
    needs: [rightsize]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RIGHTSIZE_RESULT: ${{ needs.rightsize.result }}
      WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: cost-report
          path: report
      - name: Post the summary
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then
            echo "NOTIFY_WEBHOOK_URL is not set; no notification sent"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          report = {}
          try:
              report = json.load(open("report/cost-report.json"))
          except (OSError, ValueError):
              pass
          if os.environ["RIGHTSIZE_RESULT"] != "success":
              line = f"RIGHT-SIZING FAILED ({os.environ['RIGHTSIZE_RESULT']})"
          else:
              observed = (report.get("rightsizing") or {}).get("observed") or {}
              proposals = (report.get("rightsizing") or {}).get("recommendations") or []
              usage = f"about ${observed['usd_month_at_list_price']:.2f}/month at list price from measured usage" if observed else "no usage metrics in the window"
              line = f"weekly cost report: {usage}; {len(proposals)} proposal(s)"
          text = f"Lab Deploy, {os.environ['REPOSITORY']}: {line}. {os.environ['RUN_URL']}"
          body = json.dumps({"text": text, "content": text}).encode()
          request = urllib.request.Request(os.environ["WEBHOOK"], data=body, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(request, timeout=20) as response:  # noqa: S310 - operator-configured webhook secret
              print("notification sent:", response.status)
          PY
