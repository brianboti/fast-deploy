name: Deploy GCP staging
run-name: deploy-${{ inputs.plan_id }}
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        required: true
        type: string
      spec_hash:
        required: true
        type: string
      plan_id:
        required: true
        type: string
      target_json:
        required: true
        type: string
      image_digest:
        description: Reuse an already-attested image for this commit instead of building again (full digest reference)
        required: false
        default: ''
        type: string
      provenance:
        description: required, or unavailable for the operator's exception (staging or an emergency; refused with image_digest)
        required: false
        default: required
        type: choice
        options: [required, unavailable]
      bake_seconds:
        description: Seconds to watch the promoted revision's logs before the release counts as done (0 to 900; a crash or 5xx answers restore the previous traffic)
        required: false
        default: '300'
        type: string
permissions:
  contents: read
concurrency:
  group: gcp-staging
  cancel-in-progress: false
  queue: max
env:
  COMMIT_SHA: ${{ inputs.commit_sha }}
  SPEC_HASH: ${{ inputs.spec_hash }}
  PLAN_ID: ${{ inputs.plan_id }}
  TARGET_JSON: ${{ inputs.target_json }}
  IMAGE_DIGEST_INPUT: ${{ inputs.image_digest }}
  PROVENANCE_INPUT: ${{ inputs.provenance }}
  BAKE_SECONDS: ${{ inputs.bake_seconds }}
jobs:
  build:
    # Skipped when the plan reuses an image this workflow already built and attested for the same commit.
    if: inputs.image_digest == ''
    runs-on: ubuntu-24.04
    # A real application's suite takes minutes on its own (Sophia's 913 tests: about nine on a laptop), before the build.
    timeout-minutes: 45
    steps:
      - name: Validate dispatch inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SPEC_HASH" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PLAN_ID" =~ ^[a-f0-9]{32}$ ]]
          [[ "$BAKE_SECONDS" =~ ^[0-9]{1,3}$ ]] && [ "$BAKE_SECONDS" -le 900 ]
          test "$GITHUB_REF" = "refs/heads/main"
          # The commit must be the tip of main or already part of its history: never an unmerged branch.
          if [ "$COMMIT_SHA" != "$GITHUB_SHA" ]; then
            STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT_SHA...$GITHUB_SHA" --jq .status)
            [ "$STATUS" = "ahead" ] || [ "$STATUS" = "identical" ]
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          path: app
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PLATFORM_REPOSITORY
          ref: PLATFORM_COMMIT
          persist-credentials: false
          path: platform
          # For a private platform repo: read-only fine-grained token or App token.
          token: ${{ secrets.PLATFORM_READ_TOKEN || github.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install trusted platform dependencies
        run: python -m pip install --require-hashes -r platform/requirements.lock
      - name: Validate reviewed specification
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from labdeploy.models import parse_spec, spec_hash, enforce
          spec = parse_spec(Path('app/platform.yaml').read_text())
          enforce(spec)
          assert spec_hash(spec) == os.environ['SPEC_HASH'], 'Spec hash mismatch'
          PY
      - name: Read the application's test policy
        id: policy
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
        shell: bash
        run: |
          set -euo pipefail
          TESTS=$(python -c 'from pathlib import Path; from labdeploy.models import parse_spec; print(parse_spec(Path("app/platform.yaml").read_text()).tests)')
          [[ "$TESTS" =~ ^(required|none)$ ]]
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          PYTHON=$(python -c 'from pathlib import Path; from labdeploy.models import parse_spec; print(parse_spec(Path("app/platform.yaml").read_text()).python)')
          [[ "$PYTHON" =~ ^3\.(11|12|13|14|15)$ ]]
          echo "python=$PYTHON" >> "$GITHUB_OUTPUT"
          [ "$TESTS" = "required" ] || echo "::warning::platform.yaml declares tests: none; no automated tests guard this release"
      # The application's own Python (platform.yaml `python`) for its tests and its dependency audit; the platform's steps
      # keep theirs on PATH.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: app-python
        with:
          python-version: ${{ steps.policy.outputs.python }}
          update-environment: false
      - name: Run unit tests
        if: steps.policy.outputs.tests == 'required'
        working-directory: app
        env:
          APP_PYTHON: ${{ steps.app-python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$APP_PYTHON" -m venv .test-venv
          if [ -f requirements.lock ]; then
            .test-venv/bin/pip install --require-hashes -r requirements.lock
          else
            .test-venv/bin/pip install -r requirements.txt
          fi
          .test-venv/bin/pip install -r requirements-dev.txt
          .test-venv/bin/python -m pytest
      # On the application's own Python: version markers select what that Python installs, and a pin that exists only for
      # an older Python (numpy 1.24 on 3.11) is not refused for failing to install on the platform's 3.12.
      - name: Audit Python dependencies
        working-directory: app
        env:
          APP_PYTHON: ${{ steps.app-python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$APP_PYTHON" -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/pip" install --require-hashes --only-binary=:all: -r ../platform/audit.lock
          if [ -f requirements.lock ]; then
            # Every locked package at its exact version, read from the lock without installing or building anything.
            "$RUNNER_TEMP/audit-venv/bin/python" -m pip_audit --disable-pip -r requirements.lock
          else
            "$RUNNER_TEMP/audit-venv/bin/python" -m pip_audit -r requirements.txt
          fi
      # hadolint checks the Dockerfile against Docker's best practices. Its findings become annotations on this run and travel
      # with the release receipt; they stop a release only when the repository variable HADOLINT_BLOCKING is 'true', and then
      # only for error-level findings (the default from 1.10.0). Downloaded by version and checked against its SHA-256.
      - name: Lint the Dockerfile
        env:
          HADOLINT_BLOCKING: ${{ vars.HADOLINT_BLOCKING || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  $RUNNER_TEMP/hadolint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/hadolint"
          mkdir -p bundle
          "$RUNNER_TEMP/hadolint" --no-fail --format json app/Dockerfile > bundle/hadolint.json
          python3 - <<'PY'
          import json, os
          def escape(text, property=False):
              text = str(text).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              return text.replace(":", "%3A").replace(",", "%2C") if property else text
          findings = json.load(open("bundle/hadolint.json"))
          command = {"error": "error", "warning": "warning"}
          for f in findings:
              kind = command.get(f.get("level"), "notice")
              print(f"::{kind} file=Dockerfile,line={int(f.get('line') or 1)},title={escape('hadolint ' + str(f.get('code')), True)}::{escape(f.get('message', ''))}")
          counts = {}
          for f in findings:
              counts[str(f.get("level"))] = counts.get(str(f.get("level")), 0) + 1
          line = "Dockerfile lint (hadolint 2.15.1): " + (", ".join(f"{n} {level}" for level, n in sorted(counts.items())) or "no findings")
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(line + "\n")
          if counts.get("error") and os.environ["HADOLINT_BLOCKING"] == "true":
              raise SystemExit("hadolint found error-level problems and HADOLINT_BLOCKING is true for this repository")
          PY
      - name: Build without cloud credentials
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -t "lab-app:$COMMIT_SHA" app
          mkdir -p bundle
          docker save "lab-app:$COMMIT_SHA" -o bundle/image.tar
          cp app/platform.yaml bundle/platform.yaml
          sha256sum bundle/image.tar | cut -d' ' -f1 > bundle/image.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: bundle/
          retention-days: 3
          if-no-files-found: error
  deploy:
    needs: build
    # !cancelled(), not always(): it still runs when build is skipped (a reused image), but a cancelled run cancels it.
    # With always() GitHub kept the job running after a cancel, and the release went on to promote (live, 2026-10-13).
    if: ${{ !cancelled() && needs.build.result != 'failure' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    # Twenty minutes for the release and its migration, plus up to fifteen for the bake (bake_seconds is at most 900).
    timeout-minutes: 35
    # GitHub records a deployment for this environment job; the URL below makes it show the released service.
    environment:
      name: staging
      url: ${{ steps.url.outputs.url }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      REGISTRY_NAME: ${{ vars.ARTIFACT_REPOSITORY }}
      PROBE_SERVICE_ACCOUNT: ${{ vars.PROBE_SERVICE_ACCOUNT }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      RECOVERY_BUCKET: ${{ vars.RECOVERY_BUCKET }}
      IAP_CLIENT_ID: ${{ vars.IAP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PLATFORM_REPOSITORY
          ref: PLATFORM_COMMIT
          persist-credentials: false
          path: platform
          token: ${{ secrets.PLATFORM_READ_TOKEN || github.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r platform/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.image_digest == ''
        with:
          name: release-bundle
          path: bundle
      # Reuse: the reviewed configuration comes from the commit itself; the image was built and attested by an earlier run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.image_digest != ''
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          path: app
      - name: Validate dispatch inputs for reuse
        if: inputs.image_digest != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SPEC_HASH" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PLAN_ID" =~ ^[a-f0-9]{32}$ ]]
          [[ "$BAKE_SECONDS" =~ ^[0-9]{1,3}$ ]] && [ "$BAKE_SECONDS" -le 900 ]
          test "$GITHUB_REF" = "refs/heads/main"
          if [ "$COMMIT_SHA" != "$GITHUB_SHA" ]; then
            STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT_SHA...$GITHUB_SHA" --jq .status)
            [ "$STATUS" = "ahead" ] || [ "$STATUS" = "identical" ]
          fi
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$REGISTRY_NAME/$SERVICE"
          [[ "$IMAGE_DIGEST_INPUT" =~ ^"$IMAGE"@sha256:[a-f0-9]{64}$ ]]
          mkdir -p bundle && cp app/platform.yaml bundle/platform.yaml
          echo "IMAGE_DIGEST=$IMAGE_DIGEST_INPUT" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=$IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_SHA256=${IMAGE_DIGEST_INPUT##*@}" >> "$GITHUB_ENV"
      - name: Validate artifact and deployment configuration
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
          REUSING_IMAGE: ${{ inputs.image_digest != '' }}
        run: |
          python - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          from labdeploy.models import parse_spec, spec_hash, enforce
          from labdeploy.target import verify_target, environment_target
          verify_target(os.environ['TARGET_JSON'], environment_target())
          spec = parse_spec(Path('bundle/platform.yaml').read_text())
          enforce(spec)
          assert spec_hash(spec) == os.environ['SPEC_HASH']
          assert spec.name == os.environ['SERVICE']
          for name in ('GCP_PROJECT_ID', 'GCP_REGION', 'SERVICE', 'REGISTRY_NAME'):
              assert re.fullmatch(r'[a-z][a-z0-9-]+', os.environ[name]), name
          assert re.fullmatch(r'[a-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com', os.environ['PROBE_SERVICE_ACCOUNT'])
          if os.environ['REUSING_IMAGE'] != 'true':
              with open('bundle/image.tar', 'rb') as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == Path('bundle/image.sha256').read_text().strip()
          PY
      # Provenance links this exact digest to this commit and workflow run; the release deploys only a verified digest.
      # A public repository uses GitHub's attestation. A private one, which GitHub attests only on Enterprise Cloud, signs
      # with the application's own Cloud KMS key through Cosign. Skipping it is the operator's exception, for a fresh build only.
      - name: Choose the provenance path
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROVENANCE_INPUT" = "unavailable" ]; then
            if [ -n "$IMAGE_DIGEST_INPUT" ]; then
              echo "::error title=Provenance::the provenance exception is refused for a reused image: only its provenance shows this pipeline built it"
              exit 1
            fi
            MODE=unavailable
            echo "::warning title=Provenance not recorded::the operator's exception (provenance: unavailable) is set for this application, so this image is deployed without signed provenance"
          elif [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = "public" ]; then
            MODE=github
          else
            MODE=cosign-kms
          fi
          echo "Provenance path: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "PROVENANCE_MODE=$MODE" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Configure registry access
        shell: bash
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
      - name: Recover any interrupted previous release
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
          RECOVERY_ONLY: 'true'
        run: python -m labdeploy.release
      - name: Push image and resolve immutable digest
        if: inputs.image_digest == ''
        shell: bash
        run: |
          set -euo pipefail
          docker load -i bundle/image.tar
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$REGISTRY_NAME/$SERVICE"
          docker tag "lab-app:$COMMIT_SHA" "$IMAGE:$COMMIT_SHA"
          docker push "$IMAGE:$COMMIT_SHA"
          # A second, immutable tag per release keeps the digest findable by plan id after the commit tag moves on a rebuild.
          docker tag "lab-app:$COMMIT_SHA" "$IMAGE:release-$PLAN_ID"
          docker push "$IMAGE:release-$PLAN_ID"
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE:$COMMIT_SHA" --format='value(image_summary.digest)')
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "IMAGE_DIGEST=$IMAGE@$DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=$IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_SHA256=$DIGEST" >> "$GITHUB_ENV"
      # GitHub's path: signed SLSA provenance stored by GitHub, never a long-lived key.
      - name: Attest build provenance
        if: inputs.image_digest == '' && steps.provenance.outputs.mode == 'github'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_SHA256 }}
      - name: Verify build provenance
        if: steps.provenance.outputs.mode == 'github'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "oci://$IMAGE_DIGEST" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy-gcp.yml"
      # The Cloud KMS path: only this application's deployer may sign with its key, and the deployer is reachable only from
      # these workflows on main in the staging environment.
      - name: Install Cosign
        if: steps.provenance.outputs.mode == 'cosign-kms'
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cosign" https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  $RUNNER_TEMP/cosign" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/cosign"
          echo "COSIGN=$RUNNER_TEMP/cosign" >> "$GITHUB_ENV"
          echo "PROVENANCE_KEY=$(python -m labdeploy.provenance key)" >> "$GITHUB_ENV"
      # Stored next to the image as its sha256-<digest>.att tag, which the registry keeps. No transparency log: a public log
      # would publish a private repository's name and commits.
      - name: Sign build provenance with Cloud KMS
        if: inputs.image_digest == '' && steps.provenance.outputs.mode == 'cosign-kms'
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
        shell: bash
        run: |
          set -euo pipefail
          python -m labdeploy.provenance predicate > "$RUNNER_TEMP/provenance.json"
          if ! "$COSIGN" attest --yes --key "$PROVENANCE_KEY" --type slsaprovenance1 --predicate "$RUNNER_TEMP/provenance.json" \
              --new-bundle-format=false --use-signing-config=false --tlog-upload=false "$IMAGE_DIGEST"; then
            echo "::error title=Provenance::signing with $PROVENANCE_KEY failed. A missing key means the foundation (scripts/apply-foundation.sh) and then this application's infrastructure need applying"
            exit 1
          fi
      - name: Verify build provenance with Cloud KMS
        if: steps.provenance.outputs.mode == 'cosign-kms'
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
        shell: bash
        run: |
          set -euo pipefail
          "$COSIGN" verify-attestation --key "$PROVENANCE_KEY" --type slsaprovenance1 --insecure-ignore-tlog=true "$IMAGE_DIGEST" > "$RUNNER_TEMP/verified.jsonl"
          python -m labdeploy.provenance verify "$RUNNER_TEMP/verified.jsonl"
      - name: Summarize image vulnerabilities
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
          BLOCK_ON_CRITICAL_VULNERABILITIES: ${{ vars.BLOCK_ON_CRITICAL_VULNERABILITIES || 'false' }}
        run: python -m labdeploy.scan
      - name: Deploy, probe, promote; restore traffic on failure
        id: release
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
          SPEC_FILE: bundle/platform.yaml
        shell: bash
        # exec: the release becomes the step's own process, so a cancelled run's SIGINT and SIGTERM reach it and it restores
        # traffic itself. Behind a waiting shell they never did: a cancel requested mid-migration let the release promote.
        run: exec python -m labdeploy.release
      - name: Record the service URL
        id: url
        shell: bash
        run: echo "url=$(python -c 'import json; print(json.load(open("release-receipt.json")).get("url", ""))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-receipt
          path: |
            release-receipt.json
            vulnerability-summary.json
          if-no-files-found: warn
          retention-days: 30
  notify:
    # Posts the outcome to the NOTIFY_WEBHOOK_URL secret (Slack or Discord incoming webhook) when it is set; silent otherwise.
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: release-receipt
          path: receipt
      - name: Post the result
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then
            echo "NOTIFY_WEBHOOK_URL is not set; no notification sent"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          receipt = {}
          try:
              receipt = json.load(open("receipt/release-receipt.json"))
          except (OSError, ValueError):
              pass
          plan, commit = os.environ["PLAN_ID"], os.environ["COMMIT_SHA"][:12]
          build, deploy = os.environ["BUILD_RESULT"], os.environ["DEPLOY_RESULT"]
          bake = receipt.get("bake") or {}
          if deploy == "success" and receipt.get("state") == "succeeded":
              line = f"SUCCEEDED: revision {receipt.get('revision')} serves all traffic at {receipt.get('url')}"
              if bake.get("result") in ("inconclusive", "unobserved", "skipped"):
                  line += f" (bake {bake['result']}: nothing more than the probes vouches for it)"
          elif receipt.get("state") == "traffic_restored" and receipt.get("failed_phase") == "baking" and not receipt.get("cancelled"):
              line = f"FAILED AFTER PROMOTION: the new revision served traffic but failed its bake ({receipt.get('error')}); the previous traffic was restored"
          elif build not in ("success", "skipped"):
              line = f"FAILED in the build job ({build}): tests, dependency audit or image build"
          elif receipt.get("state") == "traffic_restored":
              line = f"FAILED: the candidate did not pass ({receipt.get('error')}); traffic was restored to the previous revision"
          elif receipt.get("state") == "rollback_failed_manual_recovery_required":
              line = f"FAILED AND NOT RESTORED: {receipt.get('restore_error')}; run the recovery workflow now"
          elif deploy == "cancelled":
              line = f"CANCELLED at phase '{receipt.get('state', 'unknown')}'; the recovery workflow checks the checkpoint"
          else:
              line = f"FAILED in the deploy job ({deploy}) at phase '{receipt.get('state', 'before the release step')}'"
          text = f"Lab Deploy, {os.environ['REPOSITORY']}, plan {plan[:8]} (commit {commit}): {line}. {os.environ['RUN_URL']}"
          body = json.dumps({"text": text, "content": text}).encode()
          request = urllib.request.Request(os.environ["WEBHOOK"], data=body, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(request, timeout=20) as response:  # noqa: S310 - operator-configured webhook secret
              print("notification sent:", response.status)
