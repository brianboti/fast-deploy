name: Recover GCP staging
# workflow_run is acceptable here: this workflow never checks out or executes the triggering workflow's code.
on: # zizmor: ignore[dangerous-triggers]
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy GCP staging']
    types: [completed]
  # Safety net only: the completion trigger above handles every normal release. Each scheduled run costs Actions
  # minutes on private repositories, so this stays at every six hours.
  schedule:
    - cron: '7 */6 * * *'
permissions:
  contents: read
concurrency:
  group: gcp-staging
  cancel-in-progress: false
  queue: max
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      REGISTRY_NAME: ${{ vars.ARTIFACT_REPOSITORY }}
      PROBE_SERVICE_ACCOUNT: ${{ vars.PROBE_SERVICE_ACCOUNT }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      RECOVERY_BUCKET: ${{ vars.RECOVERY_BUCKET }}
      RECOVERY_ONLY: 'true'
    steps:
      # Never check out or execute code from the triggering application workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PLATFORM_REPOSITORY
          ref: PLATFORM_COMMIT
          persist-credentials: false
          path: platform
          token: ${{ secrets.PLATFORM_READ_TOKEN || github.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r platform/requirements.lock
      - name: Validate configured recovery destination
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
        run: python -m labdeploy.target
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Recover interrupted release from durable journal
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
        run: python -m labdeploy.release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovery-receipt
          path: recovery-receipt.json
          if-no-files-found: warn
          retention-days: 30
