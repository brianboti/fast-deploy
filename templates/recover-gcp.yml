name: Recover GCP staging
run-name: ${{ inputs.rollback_plan_id && format('rollback-{0}', inputs.rollback_plan_id) || 'Recover GCP staging' }}
# workflow_run is acceptable here: this workflow never checks out or executes the triggering workflow's code.
on: # zizmor: ignore[dangerous-triggers]
  workflow_dispatch:
    inputs:
      rollback_plan_id:
        description: Roll traffic back from the completed release with this plan id to the split recorded before it
        required: false
        default: ''
        type: string
  workflow_run:
    workflows: ['Deploy GCP staging']
    types: [completed]
  # Safety net only: the completion trigger above handles every normal release. Each scheduled run costs Actions
  # minutes on private repositories, so this stays at every six hours.
  schedule:
    - cron: '7 */6 * * *'
permissions:
  contents: read
concurrency:
  group: gcp-staging
  cancel-in-progress: false
  queue: max
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      REGISTRY_NAME: ${{ vars.ARTIFACT_REPOSITORY }}
      PROBE_SERVICE_ACCOUNT: ${{ vars.PROBE_SERVICE_ACCOUNT }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      RECOVERY_BUCKET: ${{ vars.RECOVERY_BUCKET }}
      RECOVERY_ONLY: 'true'
      ROLLBACK_PLAN_ID: ${{ inputs.rollback_plan_id }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$ROLLBACK_PLAN_ID" || "$ROLLBACK_PLAN_ID" =~ ^[a-f0-9]{32}$ ]]
      # Never check out or execute code from the triggering application workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PLATFORM_REPOSITORY
          ref: PLATFORM_COMMIT
          persist-credentials: false
          path: platform
          token: ${{ secrets.PLATFORM_READ_TOKEN || github.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r platform/requirements.lock
      - name: Validate configured recovery destination
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
        run: python -m labdeploy.target
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Recover interrupted release from durable journal
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
        run: python -m labdeploy.release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovery-receipt
          path: recovery-receipt.json
          if-no-files-found: warn
          retention-days: 30
  notify:
    # Only a recovery that did something, or that failed, is worth a message; routine "no recovery needed" runs stay quiet.
    needs: [recover]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RECOVER_RESULT: ${{ needs.recover.result }}
      ROLLBACK_PLAN_ID: ${{ inputs.rollback_plan_id }}
      WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: recovery-receipt
          path: receipt
      - name: Post the result
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then
            echo "NOTIFY_WEBHOOK_URL is not set; no notification sent"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          receipt = {}
          try:
              receipt = json.load(open("receipt/recovery-receipt.json"))
          except (OSError, ValueError):
              pass
          result, state = os.environ["RECOVER_RESULT"], receipt.get("state")
          if result == "success" and state in (None, "no_recovery_needed"):
              print("routine run, nothing to report")
              raise SystemExit(0)
          if result == "success" and state == "rolled_back":
              line = f"ROLLED BACK: traffic is on {receipt.get('restored_traffic')} again, away from {receipt.get('rolled_back_from')}"
          elif result == "success":
              line = f"RECOVERY {state}: traffic restored to {receipt.get('previous_traffic')} for plan {str(receipt.get('plan_id', ''))[:8]}"
          elif os.environ.get("ROLLBACK_PLAN_ID"):
              line = f"ROLLBACK FAILED ({result}); traffic was not changed, inspect the run log"
          else:
              line = f"RECOVERY FAILED ({result}); inspect the checkpoint and Cloud Run now"
          text = f"Lab Deploy, {os.environ['REPOSITORY']}: {line}. {os.environ['RUN_URL']}"
          body = json.dumps({"text": text, "content": text}).encode()
          request = urllib.request.Request(os.environ["WEBHOOK"], data=body, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(request, timeout=20) as response:  # noqa: S310 - operator-configured webhook secret
              print("notification sent:", response.status)
          PY
