# Drafted by Fast Deploy (docs/DEVELOPER-CONTRACT.md, section 1): the tests on every pull request, so main stays releasable.
# Make the "__JOB__" check required for main. The actions are pinned to the commits the platform itself uses and Dependabot
# proposes their updates; the Node.js line is the one platform.yaml names, and the install runs as the platform's does:
# every install script off, then only the packages build.scripts lists.
name: __WORKFLOW_NAME__
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  __JOB__:
    name: __JOB__
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: __WORKING_DIRECTORY__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '__NODE__'
          package-manager-cache: false
      - name: Install the dependencies with their scripts off
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          __REBUILD__
      - name: Run the tests
        run: |
          set -euo pipefail
          # npm test when package.json has a test script of its own, else node --test with its default file patterns.
          if node -e 'const t = (require("./package.json").scripts || {}).test || ""; process.exit(t && !/no test specified/.test(t) ? 0 : 1)'; then
            npm test
          else
            node --test
          fi
