# Drafted by Lab Deploy (docs/DEVELOPER-CONTRACT.md, section 1): the tests on every pull request, so main stays releasable.
# Make the "__JOB__" check required for main. The actions are pinned to the commits the platform itself uses and Dependabot
# proposes their updates; the Python is the one platform.yaml names.
name: __WORKFLOW_NAME__
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  __JOB__:
    name: __JOB__
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: __WORKING_DIRECTORY__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '__PYTHON__'
      - name: Install the dependencies and the test tools
        run: |
          set -euo pipefail
          if [ -f requirements.lock ]; then
            python -m pip install --require-hashes -r requirements.lock
          else
            python -m pip install -r requirements.txt
          fi
          python -m pip install -r requirements-dev.txt
      # Dependabot updates requirements.txt but not the lock; a stale lock would ship the old versions without a word.
      - name: Check that requirements.lock has every pin in requirements.txt
        run: |
          set -euo pipefail
          [ -f requirements.lock ] || exit 0
          python - <<'PY'
          import re
          def pins(path):
              found = re.findall(r"(?m)^([A-Za-z0-9][A-Za-z0-9._-]*)(?:\[[^\]]*\])?==([^\s;\\]+)", open(path).read())
              return {(re.sub(r"[-_.]+", "-", name).lower(), version) for name, version in found}
          stale = sorted(pins("requirements.txt") - pins("requirements.lock"))
          if stale:
              raise SystemExit("requirements.lock does not have " + ", ".join(f"{n}=={v}" for n, v in stale)
                               + " from requirements.txt; recompile it with: __LOCK_COMMAND__")
          PY
      - name: Run the tests
        run: python -m pytest
