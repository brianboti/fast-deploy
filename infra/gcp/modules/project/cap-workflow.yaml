# Spending cap: runs on every budget notification. Once the budget line is crossed it closes ingress on every Cloud Run
# service in the region that carries the label lab-deploy-managed=true (set by the service module), stops every Cloud SQL
# instance with that label, and optionally detaches billing at a higher line.
# Reopen with: gcloud run services update SERVICE --ingress=all; restart a database with: gcloud sql instances patch NAME --activation-policy=ALWAYS
# Workflows expressions take no map or list literals ({} or []), so missing fields are tested with `in` instead of default().
main:
  params: [event]
  steps:
    - decode:
        assign:
          - message: ${json.decode(text.decode(base64.decode(event.data.message.data)))}
          - exceeded: ${default(map.get(message, "alertThresholdExceeded"), 0)}
          - cost: ${default(map.get(message, "costAmount"), 0)}
          - budget: ${default(map.get(message, "budgetAmount"), 0)}
          - closed: []
          - stopped: []
    - below_cap:
        switch:
          - condition: ${exceeded < __THRESHOLD__}
            next: report_below
    - list_services:
        call: http.get
        args:
          url: '${"https://run.googleapis.com/v2/projects/__PROJECT__/locations/__REGION__/services"}'
          auth:
            type: OAuth2
        result: listing
    - nothing_to_close:
        switch:
          - condition: ${not ("services" in listing.body)}
            next: list_instances
    - close_ingress:
        for:
          value: service
          in: ${listing.body.services}
          steps:
            - managed_only:
                switch:
                  - condition: ${not ("labels" in service)}
                    next: continue
                  - condition: ${not ("lab-deploy-managed" in service.labels)}
                    next: continue
                  - condition: ${service.labels["lab-deploy-managed"] != "true"}
                    next: continue
            - patch:
                call: http.patch
                args:
                  url: '${"https://run.googleapis.com/v2/" + service.name + "?updateMask=ingress"}'
                  auth:
                    type: OAuth2
                  body:
                    ingress: INGRESS_TRAFFIC_INTERNAL_ONLY
            - remember:
                assign:
                  - closed: ${list.concat(closed, service.name)}
    - list_instances:
        call: http.get
        args:
          url: '${"https://sqladmin.googleapis.com/v1/projects/__PROJECT__/instances"}'
          query:
            filter: "settings.userLabels.lab-deploy-managed:true"
          auth:
            type: OAuth2
        result: instances
    - nothing_to_stop:
        switch:
          - condition: ${not ("items" in instances.body)}
            next: log_closed
    - stop_instances:
        for:
          value: instance
          in: ${instances.body.items}
          steps:
            - stop:
                call: http.patch
                args:
                  url: '${"https://sqladmin.googleapis.com/v1/projects/__PROJECT__/instances/" + instance.name}'
                  auth:
                    type: OAuth2
                  body:
                    settings:
                      activationPolicy: NEVER
            - remember_stop:
                assign:
                  - stopped: ${list.concat(stopped, instance.name)}
    - log_closed:
        assign:  # expressions are limited to 400 characters, so the message is built in parts
          - headline: '${"Lab Deploy spending cap: budget line crossed (" + string(cost) + " of " + string(budget) + ", threshold " + string(exceeded) + ")"}'
          - actions: '${"; ingress closed on " + string(len(closed)) + " managed services " + json.encode_to_string(closed) + "; stopped " + string(len(stopped)) + " databases " + json.encode_to_string(stopped)}'
    - log_message:
        call: sys.log
        args:
          severity: WARNING
          text: '${headline + actions + ". Reopen with gcloud run services update SERVICE --ingress=all and gcloud sql instances patch NAME --activation-policy=ALWAYS"}'
    - maybe_detach:
        switch:
          - condition: ${"__DETACH__" == "true" and exceeded >= __DETACH_THRESHOLD__}
            steps:
              - detach:
                  call: http.put
                  args:
                    url: '${"https://cloudbilling.googleapis.com/v1/projects/__PROJECT__/billingInfo"}'
                    auth:
                      type: OAuth2
                    body:
                      billingAccountName: ""
              - log_detached:
                  call: sys.log
                  args:
                    severity: CRITICAL
                    text: '${"Lab Deploy spending cap: billing detached from the project at " + string(exceeded) + " of the budget"}'
    - done:
        return: '${"cap enforced at threshold " + string(exceeded) + " on " + string(len(closed)) + " services and " + string(len(stopped)) + " databases"}'
    - report_below:
        return: '${"below cap: threshold " + string(exceeded) + " of budget " + string(budget)}'
