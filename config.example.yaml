live_dispatch: false
database: deployments.db
# Where this platform's code lives; lets update_app_workflows regenerate app workflows against its commits.
# platform:
#   repository: YOUR_ORG/lab-deploy
#   commit: null              # default: the tip of main
# log_file: /var/lib/lab-deploy/controller.log   # optional rotating controller log
allowed_hosts:
  - "127.0.0.1:*"
  - "localhost:*"
# Add the exact remote HTTPS host before using Claude Chat.
# Browser sign-in for Claude's hosted connector: Claude opens https://HOST/login, you paste an operator token once, and it
# receives short-lived tokens. public_url is the controller's https origin; list the same host in allowed_hosts.
# oauth:
#   public_url: https://deploy.example.edu
#   access_token_seconds: 3600   # default; 300 to 86400
#   refresh_token_days: 30       # default; 1 to 365
# rate_limit_per_minute: 120      # requests per operator identity (default)
# auth_failures_per_minute: 20    # failed logins per client address (default)
applications:
  demo:
    repository: YOUR_ORG/YOUR_APP
    branch: main
    service: lab-demo
    workflow: deploy-gcp.yml
    # Optional guardrail: refuse plans whose worst-case monthly compute (every allowed instance busy all month) exceeds this.
    cost_ceiling_usd: 150
    target:
      project_id: your-staging-project
      region: us-central1
      service: lab-demo
      registry: lab-demo
      deploy_service_account: lab-demo-deploy@your-staging-project.iam.gserviceaccount.com
      probe_service_account: lab-demo-probe@your-staging-project.iam.gserviceaccount.com
      wif_provider: projects/123456789/locations/global/workloadIdentityPools/lab-demo-gh/providers/github
      recovery_bucket: your-staging-project-lab-demo-recovery
principals:
  - name: release-manager
    # Generate with `lab-deploy token`; keep raw token in your password manager.
    token_sha256: "REPLACE_WITH_GENERATED_SHA256"
    applications: [demo]
    can_deploy: true

