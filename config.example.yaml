live_dispatch: false
database: deployments.db
# Where this platform's code lives; lets update_app_workflows regenerate app workflows against its commits.
# platform:
#   repository: YOUR_ORG/lab-deploy
#   commit: null              # default: the tip of main
#   minimum_commit: null      # refuse apps pinned to older platform commits
# After a release, by itself (on the machine only; docs/RUNBOOK.md "After a release"): the machine installs main once its
# checks have passed and the delay is over, then re-pins the applications' workflows to the commit it runs.
# platform_updates:
#   machine: true
#   workflows: true
#   delay_minutes: 60         # the window in which a release can still be stopped
#   quiet_minutes: 10         # restart only after this long without a tool call
# paused: false               # the kill switch; also available per application
# observer:                   # viewer-only identity for live health and logs (Terraform creates it)
#   service_account: lab-deploy-observer@your-staging-project.iam.gserviceaccount.com
# notify_webhook_url: https://hooks.slack.com/services/...   # daily watchdog findings
# auto_deploy_interval_seconds: 300
# backup_dir: /var/lib/lab-deploy/backups
# log_file: /var/lib/lab-deploy/controller.log   # optional rotating controller log
allowed_hosts:
  - "127.0.0.1:*"
  - "localhost:*"
# Add the exact remote HTTPS host before using Claude Chat.
# Browser sign-in for Claude's hosted connector: Claude opens https://HOST/login, you paste an operator token once, and it
# receives short-lived tokens. public_url is the controller's https origin; list the same host in allowed_hosts.
# oauth:
#   public_url: https://deploy.example.edu
#   access_token_seconds: 3600   # default; 300 to 86400
#   refresh_token_days: 30       # default; 1 to 365
# rate_limit_per_minute: 120      # requests per operator identity (default)
# auth_failures_per_minute: 20    # failed logins per client address (default)
applications:
  demo:
    repository: YOUR_ORG/YOUR_APP
    branch: main
    service: lab-demo
    workflow: deploy-gcp.yml
    # Optional guardrail: refuse plans whose worst-case monthly compute (every allowed instance busy all month) exceeds this.
    cost_ceiling_usd: 150
    # auto_deploy: true           # release the tip of main on its own; every guardrail still applies
    # provenance: unavailable     # operator's exception, staging or an emergency only: release without signed provenance
    # bake_seconds: 300           # watch the promoted revision's logs this long (0 to 900; 0 turns the bake off)
    # infra:                      # per-app Terraform settings the renderer writes into infra/gcp/apps/<service>
    #   instance_alert_count: 3   #   (keys of labdeploy.infra.DEFAULT_SETTINGS)
    target:
      project_id: your-staging-project
      region: us-central1
      service: lab-demo
      registry: lab-demo
      deploy_service_account: lab-demo-deploy@your-staging-project.iam.gserviceaccount.com
      probe_service_account: lab-demo-probe@your-staging-project.iam.gserviceaccount.com
      wif_provider: projects/123456789/locations/global/workloadIdentityPools/lab-demo-gh/providers/github
      recovery_bucket: your-staging-project-lab-demo-recovery
principals:
  - name: release-manager
    # Generate with `lab-deploy token`; keep raw token in your password manager.
    token_sha256: "REPLACE_WITH_GENERATED_SHA256"
    applications: [demo]
    can_deploy: true
    # may_merge_own_requests: false   # once there are two operators: what this identity asks for waits for the other (docs/SETUP.md 7l)

# Google's native budget spend caps for Cloud Run that exist in Cloud Billing (docs/SETUP.md 7i), project id: USD a month.
# A record for plans and the status; create the cap itself with scripts/spend-cap.sh.
# cloud_run_spend_caps:
#   your-staging-project: 20

# One-sentence onboarding (docs/SETUP.md 7g): where new applications go. Needs an identity with applications: ["*"].
# onboarding:
#   project_id: your-staging-project
#   project_number: "123456789012"
#   region: us-central1
#   default_viewers: ["user:you@example.edu"]       # who may open lab-members apps; plus `viewers` per application
#   iap_client_id: 123-abc.apps.googleusercontent.com   # after the console step in docs/SETUP.md 7h

# The operator's switches for applications onboarding registered (their entries live in the database, not here):
# application_settings:
#   my-app:
#     cost_ceiling_usd: 60       # refuse plans whose worst case is higher
#     auto_deploy: true          # release new commits on main by itself
#     paused: false              # true refuses new plans and dispatches for this app
#     viewers: ["user:someone@example.edu"]   # lab-members apps: who may open the pages, on top of default_viewers
#     provenance: unavailable    # exception only: skip signed provenance (fresh builds; a reused image is refused)
#     bake_seconds: 600          # watch the promoted revision longer (0 to 900; 0 turns the bake off)
#     auto_merge: false          # keep this app's onboarding pull requests for a person (default: onboarding.auto_merge)
