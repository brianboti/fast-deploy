[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "infrastructure-layer"
version = "1.37.1"
description = "A provider-independent Cloud Infrastructure MCP (cloudinfra) and the application delivery service above it (appdelivery)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0", "fastapi==0.143.0", "httpx==0.28.1", "pydantic==2.14.1", "PyYAML==6.0.3", "PyJWT[crypto]==2.15.1", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0", "zizmor==1.30.1"]

[project.scripts]
cloud-infra = "cloudinfra.cli:main"
app-delivery = "appdelivery.cli:main"

[tool.setuptools.packages.find]
include = ["cloudinfra*", "appdelivery*"]

[tool.setuptools.package-data]
appdelivery = ["host/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real cloud project (CLOUDINFRA_INTEGRATION=1); skipped otherwise"]

[tool.ruff]
line-length = 200
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Correctness, imports, bug-prone patterns, modern syntax, and the bandit security rules.
select = ["E", "F", "W", "I", "B", "UP", "S"]
# Every subprocess call in this code base passes a fixed argument list and never a shell string.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "S108"]
