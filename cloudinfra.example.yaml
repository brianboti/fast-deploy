# The Cloud Infrastructure MCP's configuration. Copy to cloudinfra.local.yaml (ignored by git) and start the server with
#   CLOUDINFRA_CONFIG=cloudinfra.local.yaml uvicorn cloudinfra.mcp.server:create_app --factory --host 127.0.0.1 --port 8100
# No credential lives here: on a Google Cloud machine the service uses the attached service account; on a laptop it asks
# gcloud for a token, impersonating the service account named below when one is.
database: cloudinfra.db
allowed_hosts:
  - "127.0.0.1:*"
  - "localhost:*"
# log_file: /var/lib/cloudinfra/service.log     # one JSON line per event, request and operation ids on each, secrets redacted
# rate_limit_per_minute: 120                      # requests per caller identity
# auth_failures_per_minute: 20                    # failed sign-ins per client address
# workers: 4                                      # provisioning and destruction run in this many background workers
# cleanup_on_failure: true                        # delete what a failed request created; false keeps it for inspection and says so
# sign_in:                                       # sign-in for Claude chat (docs/INFRASTRUCTURE-ARCHITECTURE.md, "Connect Claude chat")
#   url: https://infra.example.com                # the public HTTPS address; add its host to allowed_hosts
# sweep_interval_seconds: 300                     # how often expiry and idle stop are checked; 0 turns the sweeper off, and with it lifetimes and idle stop
# return_database_password: false                 # true also returns a generated database password once; it always goes to a secret
labels:                                           # the operator's labels on every resource the service creates
  environment: development
  cost-center: platform
limits:                                           # cost protection, checked before any provider call
  max_instances_per_request: 10
  max_cpu_per_instance: 32
  max_memory_gb_per_instance: 128
  max_storage_gb_per_request: 2000
  max_database_storage_gb: 1000
  max_accelerators_per_instance: 8                # 0 refuses every GPU request
  max_cache_memory_gb: 64
  max_cluster_nodes: 20
  max_monthly_cost_usd: 500                       # refuse a request whose estimate from list prices is higher
  max_active_requests_per_principal: 20
  operation_timeout_seconds: 900
  # Time. Nothing expires or stops by itself unless a request asks or one of these is set: leave them unset in production.
  # default_lifetime_hours: 168                   # requests that set no lifetime expire after this long
  # max_lifetime_hours: 720                       # the longest a request may live, extensions included; with no default, also the lifetime
  # expiry_retention_days: 7                      # a request stopped at expiry keeps its disks and databases this long
  # default_autostop_idle_minutes: 60             # stop idle machines that ask for no autostop...
  # default_autostop_scope: accelerators          # ...with GPUs only (accelerators) or every machine (all)
  # idle_cpu_cores: 0.5                           # idle: the busiest CPU sample in the window used fewer cores than this
  # max_keep_awake_hours: 72
access:                                           # who may be granted access to what the service creates; never project IAM
  allowed_domains: [example.com]                  # members must be in these domains or be a principal's identity
  # grant_requester: true                         # grant the requesting principal's identity as admin on what it creates
  # max_members: 10                               # members per request, the requester included
providers:
  gcp:
    project_id: your-infrastructure-project
    allowed_regions: [us-central1]
    default_network: default                      # where machines go when a request has no network block
    # default_subnet: null                        # needed when default_network is a custom-mode network
    # impersonate_service_account: cloudinfra@your-infrastructure-project.iam.gserviceaccount.com
    # quota_project: your-infrastructure-project   # on a laptop with a person's sign-in: the project Google counts the calls against
    # zones: {europe-west10: [a, b, c]}           # regions the adapter's own table does not know
    # cluster_node_accounts: true                 # each cluster's nodes run as an account made for it (see docs/INFRASTRUCTURE-ARCHITECTURE.md)
    # registries:                                 # Artifact Registry repositories a request may let its clusters pull from
    #   - us-central1-docker.pkg.dev/your-apps-project/shop
    # public_domains: [apps.example.com]          # DNS domains a cluster's front door may serve over HTTPS
    # allow_public_services: false                # whether a request may make a managed container service callable without signing in
    # profiles:                                   # software images the platform team approves; a request names one as compute.profile
    #   gpu-signed:                               # built with Google's cuda_installer.pyz build_image: signed drivers, Secure Boot stays on
    #     image: projects/your-images-project/global/images/family/gpu-signed-cu129
    #     description: Ubuntu 24.04 with signed NVIDIA drivers and CUDA 12.9
    #     min_boot_disk_gb: 100
    #     accelerator: required                   # required, optional or none
    #   hardened:
    #     image: projects/your-images-project/global/images/family/hardened-ubuntu-2404
    #     accelerator: none
    # default_accelerator_profile: gpu-signed     # what GPU machines get when they name no profile and no os
principals:                                       # the Application Layer systems that may call the service
  - name: app-layer
    token_sha256: "REPLACE_WITH_THE_HASH_FROM_cloud-infra_token"
    can_provision: true
    can_destroy: true                             # also needed to set a lifetime, which ends in a destroy
    # identity: serviceAccount:app-layer@your-app-project.iam.gserviceaccount.com   # granted on what this caller creates
    # scope: own                                  # own: its own requests; all: every caller's (an operator identity)
    # max_monthly_cost_usd: 100                   # a tighter ceiling than limits.max_monthly_cost_usd for this caller
  - name: observer
    token_sha256: "REPLACE_WITH_ANOTHER_HASH"     # reads only: can_provision and can_destroy default to false
    scope: all
