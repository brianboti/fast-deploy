# A small application shaped like CodeSurgeon (docs/DEVELOPER-CONTRACT.md section 4c): one service that the platform's
# clock wakes, and two jobs it starts itself, the second built on another application's test image. Work arrives as a
# request (POST /work), as a GitHub issue would; each wake moves the oldest request one step.
api_version: lab/v1
name: jobs-demo
runtime: python-http
python: "3.12"
port: 8080
health_path: /health
exposure: authenticated
tests: required
needs:
  buckets: [runs]
jobs:
  worker:
    dockerfile: jobs/worker/Dockerfile
    resources: { cpu: 1, memory_mib: 512 }
    timeout_minutes: 5
    runs_per_day: 10
    buckets: { runs: write }
  checker:
    dockerfile: jobs/checker/Dockerfile
    base: node-onnx           # an onnxruntime-node application, like BetterCare; CodeSurgeon names bettercare
    resources: { cpu: 1, memory_mib: 1024 }
    timeout_minutes: 5
    runs_per_day: 10
    buckets: { runs: read }
wake:
  path: /tick
  every_minutes: 5
reviewed: true
