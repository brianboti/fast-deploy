# The application delivery service's configuration. Copy to appdelivery.local.yaml (ignored by git). See docs/DELIVERY-SPEC.md.
# No token or key lives here: each environment names the variable that holds its cloudinfra token, and Google credentials
# come from the host (the metadata server on Google Cloud, else gcloud), which needs Token Creator on each service account.
database: appdelivery.db
# log_file: /var/lib/appdelivery/service.log    # one JSON line per event, release id and identity on each, secrets redacted
# workers: 4                                     # rollouts, rollbacks and removals run in this many background workers
# allowed_hosts: ["127.0.0.1:*", "localhost:*"]  # Host headers the MCP endpoint answers; add the service's own name behind a proxy
# rate_limit_per_minute: 120                     # requests per caller identity
# auth_failures_per_minute: 20                   # failed sign-ins per client address
# registrations_per_hour: 10                     # OAuth client registrations one address may make in an hour, with sign-in on
# max_request_bytes: 65536                       # larger request bodies are refused with 413 before they are read
# sign_in:                                       # sign-in for Claude chat (docs/INFRASTRUCTURE-ARCHITECTURE.md, "Connect Claude chat")
#   url: https://delivery.example.com            # the public HTTPS address; add its host to allowed_hosts
cloudinfra:
  url: https://infra.internal.example.com      # the infrastructure layer, read over its REST API
  # timeout_seconds: 30
gcp:
  project_id: your-infrastructure-project       # the project cloudinfra provisions in
  default_network_iap: false                    # true only if the operator's default network admits 35.235.240.0/20 on port 22
  # container_profile: container-host           # cloudinfra's Container-Optimized OS profile, named in refusals
environments:
  dev:
    # A cloudinfra principal for this environment: can_provision false, can_destroy false, scope all,
    # identity serviceAccount:<service_account below>. Its token goes in this variable.
    token_env: APPDELIVERY_DEV_INFRA_TOKEN
    service_account: appdelivery-dev@your-infrastructure-project.iam.gserviceaccount.com
    # The account a machine pulls images as: artifactregistry.reader on allowed_registries and nothing else. Its five-minute
    # token is the only credential a machine ever receives; the environment's own token never leaves this service.
    pull_service_account: pull-dev@your-infrastructure-project.iam.gserviceaccount.com
    allowed_registries: [us-central1-docker.pkg.dev/your-infrastructure-project/shop-images]
    # workload: {cpu_millicores: 1000, memory_mb: 1024, pids: 512}   # the bounds every released container runs under
    # Builds in the trusted project (docs/DELIVERY-SPEC.md section 3): Cloud Build runs them as this account, which may
    # push to the teams' registries and write logs, and nothing else. A release names only a digest built here.
    build:
      service_account: build-dev@your-infrastructure-project.iam.gserviceaccount.com
      # machine_type: E2_STANDARD_2                # E2_MEDIUM, E2_STANDARD_2, E2_HIGHCPU_8, E2_HIGHCPU_32
      # timeout_seconds: 1200
      # max_concurrent_builds: 3                   # a team's builds queued or working in this environment at once
      # max_builds_per_day: 50                     # a team's builds in this environment in 24 hours
      # builder: gcr.io/cloud-builders/docker@sha256:…   # the docker build step's image, by digest; the default is pinned
  prod:
    token_env: APPDELIVERY_PROD_INFRA_TOKEN
    service_account: appdelivery-prod@your-infrastructure-project.iam.gserviceaccount.com
    pull_service_account: pull-prod@your-infrastructure-project.iam.gserviceaccount.com
    allowed_registries: [us-central1-docker.pkg.dev/your-infrastructure-project/shop-images]
    build:
      service_account: build-prod@your-infrastructure-project.iam.gserviceaccount.com
    require_provenance: true                     # Cloud Build's provenance, signed by Google, must name the build recorded here
    require_attestation: true
    # attestation_type: slsaprovenance1
    trusted_signers:
      - gcpkms://projects/your-security-project/locations/global/keyRings/release/cryptoKeys/attestor
      # - /etc/appdelivery/keys/prod.pub
      # - {identity: release@your-ci-project.iam.gserviceaccount.com, issuer: https://accounts.google.com}
    require_approval: true
sources:                                         # repositories the platform team linked to Cloud Build (2nd gen), in this project
  shop-web:
    repository: projects/your-infrastructure-project/locations/us-central1/connections/github/repositories/acme-shop
    infra_owner: shop-team                       # the team whose principals may build it
    registry: us-central1-docker.pkg.dev/your-infrastructure-project/shop-images   # where its images are pushed
principals:                                      # application teams; tokens from: app-delivery token
  - name: shop-team
    token_sha256: "REPLACE_WITH_THE_HASH_FROM_app-delivery_token"
    infra_owner: shop-team                       # the cloudinfra principal whose requests this team may deploy onto
    environments: [dev, prod]
    can_deploy: true
    can_build: true                              # asks for builds; images are never built anywhere else
  - name: shop-oncall
    token_sha256: "REPLACE_WITH_ANOTHER_HASH"
    infra_owner: shop-team
    environments: [prod]
    can_approve: true                            # approves another principal's prod release
