# Plans every application root a pull request touches, with the read-only pipeline identity, checks the plan against
# the platform's policies (labdeploy/infra.py) and posts the result as one comment per application. Merging runs
# infra-apply.yml. Repository variables INFRA_PLAN_WIF_PROVIDER and INFRA_PLAN_SERVICE_ACCOUNT come from the foundation
# root's `pipeline` output (docs/SETUP.md 7f).
name: Infrastructure plan
on:
  pull_request:
    paths:
      - "infra/gcp/apps/**"
      - "infra/gcp/modules/service/**"
      - ".github/workflows/infra-plan.yml"
permissions: {}
defaults:
  run:
    shell: bash # -eo pipefail: a failure before a pipe (tee) fails the step
concurrency:
  group: infra-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  roots:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List the application roots this pull request affects
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPOSITORY/pulls/$NUMBER/files" --paginate --jq '.[].filename' > changed.txt
          python3 -m labdeploy.infra roots changed.txt infra/gcp/apps | tee -a "$GITHUB_OUTPUT"
  plan:
    needs: roots
    # Dormant until the operator sets the INFRA_* repository variables from the foundation root's outputs.
    if: needs.roots.outputs.apps != '[]' && vars.INFRA_PLAN_WIF_PROVIDER != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.roots.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The policy that judges this pull request comes from main, not from the pull request itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: platform-main
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.INFRA_PLAN_WIF_PROVIDER }}
          service_account: ${{ vars.INFRA_PLAN_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Plan without taking the state lock
        run: |
          cd "infra/gcp/apps/$APP"
          terraform init -input=false -no-color
          terraform plan -input=false -lock=false -no-color -out=tfplan
          terraform show -json tfplan > plan.json
          terraform show -no-color tfplan > plan.txt
      - name: Check the plan against the platform's policies (the rules on main)
        id: policy
        env:
          PYTHONPATH: platform-main
        run: |
          set +e
          python3 -m labdeploy.infra check "infra/gcp/apps/$APP/plan.json"
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Post the plan on the pull request (one comment per application, updated in place)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PYTHONPATH=platform-main python3 -m labdeploy.infra summary "infra/gcp/apps/$APP/plan.json" "$APP" "infra/gcp/apps/$APP/plan.txt" > comment.md
          marker="<!-- lab-deploy-infra:$APP -->"
          existing=$(gh api "repos/$REPOSITORY/issues/$NUMBER/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$existing" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/$REPOSITORY/issues/$NUMBER/comments" -F body=@comment.md > /dev/null
          fi
      - name: Fail when policy blocks the plan
        if: steps.policy.outputs.status != '0'
        run: exit 1
