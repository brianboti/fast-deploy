# Applies every application root a merge to main touches, with the write pipeline identity, from the protected `infra`
# environment (restrict it to main and add required reviewers in the repository settings). The plan is checked
# against the platform's policies again right before the apply, and the outputs are published to the application's
# GitHub environment when the APP_REPOS_TOKEN secret exists; otherwise they are printed for the operator to copy.
name: Infrastructure apply
on:
  push:
    branches: [main]
    paths:
      - "infra/gcp/apps/**"
      - "infra/gcp/modules/service/**"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:
    inputs:
      apps:
        description: "Application roots to apply, comma-separated (for example lab-demo), after the foundation exists"
        required: true
        type: string
permissions: {}
jobs:
  roots:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: List the application roots this push affects
        id: list
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REQUESTED: ${{ inputs.apps }}
        run: |
          if [ -n "$REQUESTED" ]; then
            echo "$REQUESTED" | tr ',' '\n' | sed 's/[[:space:]]//g; /^$/d; s|^|infra/gcp/apps/|; s|$|/main.tf|' > changed.txt
          elif git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$AFTER" > changed.txt
          else
            echo "infra/gcp/modules/service/main.tf" > changed.txt  # unknown history: treat every root as affected
          fi
          python3 -m labdeploy.infra roots changed.txt infra/gcp/apps | tee -a "$GITHUB_OUTPUT"
  apply:
    needs: roots
    # Dormant until the operator sets the INFRA_* repository variables from the foundation root's outputs.
    if: needs.roots.outputs.apps != '[]' && vars.INFRA_WIF_PROVIDER != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: infra
    concurrency:
      group: infra-apply-${{ matrix.app }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.roots.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.INFRA_WIF_PROVIDER }}
          service_account: ${{ vars.INFRA_APPLY_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Plan with the state lock
        run: |
          cd "infra/gcp/apps/$APP"
          terraform init -input=false -no-color
          terraform plan -input=false -no-color -out=tfplan
          terraform show -json tfplan > plan.json
      - name: Refuse a plan the policy rejects
        run: python3 -m labdeploy.infra check "infra/gcp/apps/$APP/plan.json"
      - name: Apply exactly that plan
        run: |
          cd "infra/gcp/apps/$APP"
          terraform apply -input=false -no-color tfplan
          terraform output -json > outputs.json
      - name: Publish the outputs to the application's GitHub environment
        env:
          APP_REPOS_TOKEN: ${{ secrets.APP_REPOS_TOKEN }}
        run: python3 -m labdeploy.infra publish "infra/gcp/apps/$APP/outputs.json" | tee -a "$GITHUB_STEP_SUMMARY"
