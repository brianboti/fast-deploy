name: Controller watch
# Pings the controller's public health address every thirty minutes; a failed run means the laptop, the tunnel or
# the controller is down, and GitHub's failed-workflow email says so. Set the CONTROLLER_HEALTH_URL repository variable.
on:
  schedule:
    - cron: '13,43 * * * *' # odd minutes: GitHub delays or drops schedules that land on the hour and half-hour
    - cron: '17 16 * * *' # once a day, three hours after the digest's default hour: is the digest still coming?
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: controller-watch
  cancel-in-progress: true
jobs:
  ping:
    if: vars.CONTROLLER_HEALTH_URL != '' && github.event.schedule != '17 16 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      URL: ${{ vars.CONTROLLER_HEALTH_URL }}
    steps:
      - name: Expect the controller's health endpoint to answer
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URL" =~ ^https://[A-Za-z0-9.-]+/healthz$ ]]
          curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 20 "$URL"
          echo
  # Watching the watcher (docs/ROADMAP.md 23.6): the controller writes its daily digest as a comment on the issue "Fast
  # Deploy: today". When no such issue has had a comment for two days, though one was opened more than two days ago, the
  # controller's background jobs or its GitHub access stopped, and this run fails, which GitHub emails. A comment counts,
  # not the issue's update time: until 1.31.5 a refused comment left a new, empty issue each day, which looked fresh.
  # Before the first digest there is nothing to check.
  digest:
    if: github.event.schedule == '17 16 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: read
    steps:
      - name: Expect the daily digest to keep coming
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ISSUES=$(gh issue list --repo "$REPOSITORY" --state open --search '"Fast Deploy: today" in:title' --limit 100 --json number,title,createdAt \
            --jq '[.[] | select(.title == "Fast Deploy: today")] | sort_by(.createdAt)')
          if [ "$(jq length <<<"$ISSUES")" = 0 ]; then
            echo "No digest issue yet: nothing to check"
            exit 0
          fi
          SINCE=$(date -u -d "@$(( $(date -u +%s) - 180000 ))" +%Y-%m-%dT%H:%M:%SZ)
          HEARD=0
          for NUMBER in $(jq -r '.[].number' <<<"$ISSUES"); do
            HEARD=$(( HEARD + $(gh api "repos/$REPOSITORY/issues/$NUMBER/comments?since=$SINCE&per_page=100" --jq length) ))
          done
          OLDEST=$(jq -r '.[0].createdAt' <<<"$ISSUES")
          echo "Open digest issues: $(jq -r '[.[].number | "#\(.)"] | join(" ")' <<<"$ISSUES"); comments since $SINCE: $HEARD"
          if [ "$HEARD" -eq 0 ] && [[ "$OLDEST" < "$SINCE" ]]; then
            echo "::error title=No daily digest::no digest comment for over two days: check the controller (scripts/machine.sh status) and its GitHub App's Issues permission (docs/SETUP.md section 4)"
            exit 1
          fi
