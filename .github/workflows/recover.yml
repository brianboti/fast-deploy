name: Recover (platform pipeline)
run-name: ${{ inputs.rollback_plan_id && format('rollback-{0}', inputs.rollback_plan_id) || 'Recover (platform pipeline)' }}
# The platform repository's own recovery for the applications whose contract it keeps (apps/<id>/platform.yaml,
# docs/ROADMAP.md D33): the same steps as templates/recover-gcp.yml, once per application, each in its own environment.
# workflow_run is acceptable here: this workflow never checks out or executes the triggering workflow's code.
on: # zizmor: ignore[dangerous-triggers]
  workflow_dispatch:
    inputs:
      application:
        description: The service to recover (its folder under apps/); empty for every service
        required: false
        default: ''
        type: string
      rollback_plan_id:
        description: Roll traffic back from the completed release with this plan id to the split recorded before it (one application)
        required: false
        default: ''
        type: string
  workflow_run:
    workflows: ['Deploy (platform pipeline)']
    types: [completed]
  # Safety net only: the completion trigger above handles every normal release.
  schedule:
    - cron: '7 */6 * * *'
permissions:
  contents: read
jobs:
  applications:
    # The applications the platform pipeline releases: one folder each under apps/.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    env:
      ONLY: ${{ inputs.application }}
      ROLLBACK_PLAN_ID: ${{ inputs.rollback_plan_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List the applications
        id: list
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$ROLLBACK_PLAN_ID" || "$ROLLBACK_PLAN_ID" =~ ^[a-f0-9]{32}$ ]]
          [[ -z "$ONLY" || "$ONLY" =~ ^[a-z][a-z0-9-]{1,19}[a-z0-9]$ ]]
          if [ -n "$ROLLBACK_PLAN_ID" ] && [ -z "$ONLY" ]; then echo "::error::A rollback names its application"; exit 1; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, re
          apps = sorted(p.parent.name for p in pathlib.Path("apps").glob("*/platform.yaml") if re.fullmatch(r"[a-z][a-z0-9-]{1,19}[a-z0-9]", p.parent.name))
          only = os.environ["ONLY"]
          if only:
              assert only in apps, f"no contract for {only} under apps/"
              apps = [only]
          print("matrix=" + json.dumps(apps))
          PY
  recover:
    needs: applications
    if: github.ref == 'refs/heads/main' && needs.applications.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        application: ${{ fromJSON(needs.applications.outputs.matrix) }}
    # The same queue as the application's releases, so a recovery never runs beside its own deploy.
    concurrency:
      group: gcp-staging-${{ matrix.application }}
      cancel-in-progress: false
      queue: max  # waiting runs wait; one never cancels a waiting release of the same service
    environment: staging-${{ matrix.application }}
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      REGISTRY_NAME: ${{ vars.ARTIFACT_REPOSITORY }}
      PROBE_SERVICE_ACCOUNT: ${{ vars.PROBE_SERVICE_ACCOUNT }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      RECOVERY_BUCKET: ${{ vars.RECOVERY_BUCKET }}
      RECOVERY_ONLY: 'true'
      ROLLBACK_PLAN_ID: ${{ inputs.rollback_plan_id }}
    steps:
      # Never check out or execute code from the triggering workflow or the application.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
          path: platform
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r platform/requirements.lock
      - name: Validate configured recovery destination
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
        run: python -m labdeploy.target
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Recover interrupted release from durable journal
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
        run: python -m labdeploy.release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: recovery-receipt-${{ matrix.application }}
          path: recovery-receipt.json
          if-no-files-found: warn
          retention-days: 30
