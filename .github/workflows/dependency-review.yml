# A pull request that adds or moves a dependency (an action, a package in pyproject.toml) with a known vulnerability of
# moderate severity or above fails here before it merges. The security assessment of 2026-10-30, section 7, S3;
# pip-audit in ci.yml covers the hash locks themselves.
name: Dependency review
on:
  pull_request:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
