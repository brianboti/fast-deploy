name: Platform tests
on:
  push:
  pull_request:
  schedule:
    - cron: '19 6 * * 1' # weekly: the dependency audit must run even when nothing is pushed
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: What changed
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          FROM="${BASE:-$BEFORE}"
          CONTRACTS_ONLY=false
          if [ -n "$FROM" ] && git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$FROM" "$HEAD")
            if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qv '^apps/'; then CONTRACTS_ONLY=true; fi
          fi
          echo "contracts_only=$CONTRACTS_ONLY" >> "$GITHUB_OUTPUT"
          [ "$CONTRACTS_ONLY" = "false" ] || echo "Only apps/ changed: the controller validated these contracts; the platform's own checks have nothing to add" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.scope.outputs.contracts_only != 'true'
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
        if: steps.scope.outputs.contracts_only != 'true'
      - name: Lint Python
        if: steps.scope.outputs.contracts_only != 'true'
        run: python -m ruff check .
      - name: Lint workflows
        if: steps.scope.outputs.contracts_only != 'true'
        # Templates must be listed as files to be audited; templates/repo holds the CI and Dependabot files the checker drafts.
        run: zizmor --no-progress .github/workflows .github/dependabot.yml templates/*.yml templates/repo/ci.yml templates/repo/dependabot.yml templates/repo/ci-node.yml templates/repo/dependabot-node.yml
      # The same hadolint, version and checksum the deploy template uses for every application's Dockerfile.
      - name: Lint Dockerfiles
        if: steps.scope.outputs.contracts_only != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  $RUNNER_TEMP/hadolint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" Dockerfile examples/demo-app/Dockerfile
      - name: Audit platform dependencies
        if: steps.scope.outputs.contracts_only != 'true'
        run: |
          python -m pip install --require-hashes -r audit.lock
          python -m pip_audit --require-hashes -r requirements.lock
          python -m pip_audit --require-hashes -r requirements-dev.lock
          python -m pip_audit --require-hashes -r tests.lock
      # scripts/export-app.sh is a zsh script; its tests run it with fake gcloud and docker, and skip where zsh is missing.
      - name: Install zsh
        if: steps.scope.outputs.contracts_only != 'true'
        run: command -v zsh || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zsh; }
      - run: python -m pytest -q
        if: steps.scope.outputs.contracts_only != 'true'
      - run: python -m pytest examples/demo-app -q
        if: steps.scope.outputs.contracts_only != 'true'
      - run: python -m labdeploy.cli validate examples/demo-app/platform.yaml
        if: steps.scope.outputs.contracts_only != 'true'
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: What changed
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          FROM="${BASE:-$BEFORE}"
          CONTRACTS_ONLY=false
          if [ -n "$FROM" ] && git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$FROM" "$HEAD")
            if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qv '^apps/'; then CONTRACTS_ONLY=true; fi
          fi
          echo "contracts_only=$CONTRACTS_ONLY" >> "$GITHUB_OUTPUT"
          [ "$CONTRACTS_ONLY" = "false" ] || echo "Only apps/ changed: the controller validated these contracts; the platform's own checks have nothing to add" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.scope.outputs.contracts_only != 'true'
        with:
          terraform_version: 1.13.5
      - name: Validate every infrastructure root (the foundation and one per application)
        if: steps.scope.outputs.contracts_only != 'true'
        working-directory: infra/gcp
        run: |
          terraform fmt -check -diff -recursive
          shopt -s nullglob  # apps-production/ appears with the first production root (docs/ROADMAP.md D37)
          for root in project apps/*/ apps-production/*/ modules/resolver/ modules/recovery-supervisor/; do
            echo "== $root"
            (cd "$root" && terraform init -backend=false -input=false && terraform validate)
          done
      # OpenTofu stays a drop-in (docs/ROADMAP.md 12.4): the same roots must validate with it. Downloaded by version and
      # checksum like hadolint; run on a copy of the committed roots, because `tofu init` rewrites a lock file for its own
      # registry and the committed ones must stay as Terraform wrote them.
      - name: Validate every infrastructure root with OpenTofu too
        if: steps.scope.outputs.contracts_only != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tofu.tar.gz" https://github.com/opentofu/opentofu/releases/download/v1.12.6/tofu_1.12.6_linux_amd64.tar.gz
          echo "50a6106fa4de523d09c87af85f3db1dd47535fc005727fdca6852146476b88ec  $RUNNER_TEMP/tofu.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/tofu" "$RUNNER_TEMP/roots" "$RUNNER_TEMP/tofu-plugins"
          tar -xzf "$RUNNER_TEMP/tofu.tar.gz" -C "$RUNNER_TEMP/tofu" tofu
          git archive HEAD infra/gcp | tar -x -C "$RUNNER_TEMP/roots"
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/tofu-plugins"
          cd "$RUNNER_TEMP/roots/infra/gcp"
          shopt -s nullglob
          for root in project apps/*/ apps-production/*/ modules/resolver/ modules/recovery-supervisor/; do
            echo "== $root (OpenTofu)"
            (cd "$root" && "$RUNNER_TEMP/tofu/tofu" init -backend=false -input=false && "$RUNNER_TEMP/tofu/tofu" validate)
          done
