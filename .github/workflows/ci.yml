name: Tests
on:
  push:
  pull_request:
  schedule:
    - cron: '19 6 * * 1' # weekly: the dependency audit must run even when nothing is pushed
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint Python
        run: python -m ruff check .
      - name: Lint workflows
        run: zizmor --no-progress .github/workflows .github/dependabot.yml
      # Both images' Dockerfiles, with hadolint pinned by version and checksum (docs/REQUIREMENTS.md).
      - name: Lint Dockerfiles
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  $RUNNER_TEMP/hadolint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" --failure-threshold error Dockerfile.cloudinfra Dockerfile.appdelivery
      - name: Audit dependencies
        run: |
          python -m pip install --require-hashes -r audit.lock
          python -m pip_audit --require-hashes -r requirements.lock
          python -m pip_audit --require-hashes -r requirements-dev.lock
          python -m pip_audit --require-hashes -r audit.lock
          python -m pip_audit --require-hashes -r pip.lock
      - run: python -m pytest -q
      # The example request validates and plans offline; the catalogs are regenerated by the tests themselves.
      - run: python -m cloudinfra.cli validate examples/infrastructure-request.yaml
      - run: python -m cloudinfra.cli plan examples/infrastructure-request.yaml
  # Both images as they are built, scanned for known vulnerabilities in their OS packages, Python packages and the gcloud
  # and Cosign binaries; a high or critical one that has a fix fails the run, weekly too (the security assessment of
  # 2026-10-30, section 7, S3). Grype is pinned by version and checksum (docs/REQUIREMENTS.md); its database is current.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build both images
        run: |
          docker build -f Dockerfile.cloudinfra -t cloudinfra:ci .
          docker build -f Dockerfile.appdelivery -t appdelivery:ci .
      - name: Scan both images
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/grype.tar.gz" https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_linux_amd64.tar.gz
          echo "64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519  $RUNNER_TEMP/grype.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP" grype
          status=0
          for image in cloudinfra:ci appdelivery:ci; do
            echo "::group::$image"
            "$RUNNER_TEMP/grype" "docker:$image" --only-fixed --fail-on high || status=1
            echo "::endgroup::"
          done
          exit "$status"
