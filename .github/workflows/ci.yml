name: Platform tests
on:
  push:
  pull_request:
  schedule:
    - cron: '19 6 * * 1' # weekly: the dependency audit must run even when nothing is pushed
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint Python
        run: python -m ruff check .
      - name: Lint workflows
        run: zizmor --no-progress .github/workflows templates/*.yml  # templates must be listed as files to be audited
      - name: Audit platform dependencies
        run: |
          python -m pip install --require-hashes -r audit.lock
          python -m pip_audit --require-hashes -r requirements.lock
          python -m pip_audit --require-hashes -r requirements-dev.lock
      - run: python -m pytest -q
      - run: python -m pytest examples/demo-app -q
      - run: python -m labdeploy.cli validate examples/demo-app/platform.yaml
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
      - name: Validate every infrastructure root (the foundation and one per application)
        working-directory: infra/gcp
        run: |
          terraform fmt -check -diff -recursive
          for root in project apps/*/; do
            echo "== $root"
            (cd "$root" && terraform init -backend=false -input=false && terraform validate)
          done
