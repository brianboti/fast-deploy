name: Rightsize (platform pipeline)
# The platform repository's own weekly right-sizing for the applications whose contract it keeps (apps/<id>/platform.yaml,
# docs/ROADMAP.md D33): the same read-only analysis as templates/rightsize-gcp.yml, once per application, each in its own
# environment; the report of each is a living issue on this repository.
on:
  workflow_dispatch:
    inputs:
      application:
        description: The service to analyse (its folder under apps/); empty for every service
        required: false
        default: ''
        type: string
      window_days:
        description: Days of Cloud Monitoring data to analyze (1-90)
        required: false
        default: '14'
        type: string
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  applications:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    env:
      ONLY: ${{ inputs.application }}
      WINDOW_DAYS: ${{ inputs.window_days || '14' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List the applications
        id: list
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WINDOW_DAYS" =~ ^[0-9]{1,2}$ ]]
          [[ -z "$ONLY" || "$ONLY" =~ ^[a-z][a-z0-9-]{1,19}[a-z0-9]$ ]]
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, re
          apps = sorted(p.parent.name for p in pathlib.Path("apps").glob("*/platform.yaml") if re.fullmatch(r"[a-z][a-z0-9-]{1,19}[a-z0-9]", p.parent.name))
          only = os.environ["ONLY"]
          if only:
              assert only in apps, f"no contract for {only} under apps/"
              apps = [only]
          print("matrix=" + json.dumps(apps))
          PY
  rightsize:
    needs: applications
    if: github.ref == 'refs/heads/main' && needs.applications.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        application: ${{ fromJSON(needs.applications.outputs.matrix) }}
    concurrency:
      group: gcp-staging-rightsize-${{ matrix.application }}
      cancel-in-progress: false
      queue: max  # waiting runs wait; one never cancels a waiting release of the same service
    environment: staging-${{ matrix.application }}
    permissions:
      contents: read
      id-token: write
      issues: write
      actions: read  # the month's runs and jobs, for this repository's billable Actions minutes in the report
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      REGISTRY_NAME: ${{ vars.ARTIFACT_REPOSITORY }}
      PROBE_SERVICE_ACCOUNT: ${{ vars.PROBE_SERVICE_ACCOUNT }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      RECOVERY_BUCKET: ${{ vars.RECOVERY_BUCKET }}
      WINDOW_DAYS: ${{ inputs.window_days || '14' }}
      APPLICATION: ${{ matrix.application }}
      # The reviewed specification is the contract this repository keeps, not a file in the application's repository.
      SPEC_FILE: platform/apps/${{ matrix.application }}/platform.yaml
    steps:
      # Read-only analysis of the deployed service. Never checks out or executes application code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
          path: platform
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r platform/requirements.lock
      - name: Validate configured destination
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
        run: python -m labdeploy.target
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Measure usage and compute right-sizing proposals
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
          GH_TOKEN: ${{ github.token }}
          BILLING_EXPORT_TABLE: ${{ vars.BILLING_EXPORT_TABLE }}
          # Written by add_production: the application's production, whose spend the same export holds (docs/ROADMAP.md 16.7).
          PRODUCTION_PROJECT_ID: ${{ vars.PRODUCTION_PROJECT_ID }}
          ONBOARDING_SUMMARY: ${{ vars.ONBOARDING_SUMMARY }}
        run: python -m labdeploy.cost
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cost-report-${{ matrix.application }}
          path: cost-report.json
          if-no-files-found: warn
          retention-days: 90
      # One living issue per application carries the latest report, so the lab sees it without asking Claude.
      - name: Publish the report as an issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/platform
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > issue-body.md
          import json, os
          from labdeploy.cost import issue_body
          print(issue_body(json.load(open("cost-report.json")), os.environ["RUN_URL"]))
          PY
          TITLE="Fast Deploy cost report: $SERVICE"
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file issue-body.md > /dev/null && echo "updated issue #$NUMBER"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file issue-body.md > /dev/null && echo "created the cost report issue"
          fi
