# Keeps the pinned action commits and Terraform providers current with weekly pull requests.
# Python dependencies are hash-locked with uv; refresh them deliberately (see docs/SETUP.md) and
# rely on the pip-audit step in CI to flag known vulnerabilities in between.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories:
      - /infra/gcp/project
      - /infra/gcp/apps/*
    schedule:
      interval: weekly
    # A new provider major is an upgrade with a validated plan, not a bump; minor and patch updates still arrive.
    ignore:
      - dependency-name: hashicorp/google
        update-types: ["version-update:semver-major"]
