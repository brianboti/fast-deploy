# Keeps the GitHub Actions this repository's own workflow uses current with weekly pull requests. Python dependencies
# are hash-locked with uv; refresh them deliberately (docs/DEVELOPMENT.md) and rely on the pip-audit step in CI to flag
# known vulnerabilities in between. The two images' pinned inputs (the Python base image, the gcloud CLI, Cosign) and
# CI's hadolint are moved by hand, with their checksums (docs/REQUIREMENTS.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release must be a week old before it is proposed: a compromised or broken one is usually caught by then.
    cooldown:
      default-days: 7
